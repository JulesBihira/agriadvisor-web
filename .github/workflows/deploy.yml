# Publishes agriadvisor.co on every push to main.
# It prepares the app first (build/build.mjs) so phones open it fast.
# If the preparation fails, nothing is published and the site stays as it was.
name: Publish agriadvisor.co

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the build tools
        run: npm install --no-save --no-audit --no-fund esbuild@0.24.2 react@18.3.1 react-dom@18.3.1
      - name: Prepare the app
        run: node build/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
